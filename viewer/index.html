<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>webcam-depth &middot; point cloud viewer</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app"></div>
<div id="hud">
  <b>point cloud viewer</b><br />
  Pick a scan from the gallery below, or drag a <code>.ply</code> in.<br />
  Drag to orbit &middot; scroll to zoom &middot; right-drag to pan.
</div>
<div id="controls">
  <label>size <input id="size" type="range" min="0.002" max="10" step="0.005" value="0.05" /></label>
  <label>near <input id="near" type="range" min="0" max="1" step="0.01" value="0.02" /></label>
  <label>far <input id="far" type="range" min="0" max="1" step="0.01" value="0.99" /></label>
  <button id="fit">fit</button>
  <button id="bg">bg</button>
  <span id="stats">0 pts</span>
</div>
<div id="drop">drop a .ply here</div>
<button id="spin" type="button">spin: auto</button>
<div id="gallery"><div id="gallery-strip"></div></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module" src="main.js"></script>
</body>
</html>

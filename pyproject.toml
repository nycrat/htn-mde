[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "webcam-depth"
version = "0.1.0"
description = "Real-time monocular depth estimation from webcam on Apple Silicon (Depth Anything V2)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "torch>=2.3",
    "torchvision>=0.18",
    "transformers>=4.43",
]

[project.scripts]
webcam-depth = "webcam_depth.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]